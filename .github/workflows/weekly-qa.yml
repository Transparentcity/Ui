name: Weekly Dashboard QA

on:
  schedule:
    # Thursday 7 AM PT. 15:00 UTC covers PST (UTC-8); runs ~8 AM PDT in summer.
    - cron: '0 15 * * 4'
  workflow_dispatch: {}

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run QA
        run: node scripts/weekly-qa/index.mjs

      - name: Fact-check sampled metrics (web search via Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly-qa/factcheck.mjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-qa-report
          path: |
            scripts/weekly-qa/report-latest.html
            scripts/weekly-qa/factcheck-queue.json
          if-no-files-found: warn

      - name: Commit updated appendix state and fact-check queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/weekly-qa/state.json scripts/weekly-qa/factcheck-queue.json
          git diff --staged --quiet || git commit -m "chore: weekly QA appendix state $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD
