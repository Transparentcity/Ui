name: Weekly Dashboard QA

on:
  schedule:
    # Thursday 7 AM PT. 15:00 UTC covers PST (UTC-8); runs ~8 AM PDT in summer.
    - cron: '0 15 * * 4'
  workflow_dispatch: {}

jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run QA
        run: node scripts/weekly-qa/index.mjs

      - name: Commit updated appendix state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/weekly-qa/state.json
          git diff --staged --quiet || git commit -m "chore: weekly QA appendix state $(date -u +%Y-%m-%d) [skip ci]"
          git push origin HEAD
